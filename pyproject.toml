[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claim-checker"
version = "0.1.0"
description = "Local multi-agent Scientific Claim Checker (SciFact): retrieve, read and judge."
requires-python = ">=3.11"
authors = [{ name = "Bhargav" }]
dependencies = [
    "datasets>=3.0",
    "huggingface_hub>=0.24",
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "torch>=2.2",
    "sentence-transformers>=3.0",
    "rank-bm25>=0.2.2",
    "ollama>=0.4",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "langgraph>=0.2",
    "streamlit>=1.35",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "jupyter", "nbconvert", "nbclient", "ipykernel"]
lora = ["transformers>=4.56", "peft>=0.17", "accelerate>=0.30"]
verifier = ["transformers>=4.56", "safetensors>=0.4", "sentencepiece>=0.2"]
verifier-training = ["bitsandbytes>=0.50.2"]
general-science = ["beautifulsoup4>=4.12"]

[project.scripts]
claim-checker = "claim_checker.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "live: requires downloaded data, built index or a running Ollama server (skipped by default)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", "artifacts", "tmp", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["claim_checker"]
