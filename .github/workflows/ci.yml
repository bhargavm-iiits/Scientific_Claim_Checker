name: ci

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: "1"   # tests must not download datasets or model weights
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,verifier,lora,general-science]"
      - name: Ruff
        run: ruff check .
      - name: Offline tests (synthetic fixtures, mocked Ollama)
        run: pytest -q
