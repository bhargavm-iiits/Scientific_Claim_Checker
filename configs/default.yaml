# Default configuration for the Scientific Claim Checker.
# All relative paths are resolved against the project root (the folder holding pyproject.toml).

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  splits_dir: data/splits
  index_dir: artifacts/index
  runs_dir: artifacts/runs
  retrieval_dir: artifacts/retrieval
  cache_dir: artifacts/cache
  prompts_dir: prompts

data:
  mteb_dataset: mteb/scifact
  mteb_config: corpus
  claims_dataset: allenai/scifact_entailment
  builder_script: scifact_entailment.py
  # Used only if the URL cannot be read from the official builder script.
  archive_url_fallback: https://scifact.s3-us-west-2.amazonaws.com/release/latest/data.tar.gz
  expected_corpus_size: 5183

splits:
  seed: 42
  smoke_size: 20
  final_size: 100

model:
  provider: ollama
  name: qwen3:4b
  host: http://127.0.0.1:11434
  temperature: 0.0
  think: false
  seed: 42
  context_tokens: 8192
  max_output_tokens: 768
  request_timeout_seconds: 180
  max_schema_repair_attempts: 1
  max_concurrent_generations: 1
  keep_alive: 30m
  cache_enabled: true

retrieval:
  embedding_model: BAAI/bge-small-en-v1.5
  query_instruction: "Represent this sentence for searching relevant passages: "
  embedding_device: cpu
  embedding_batch_size: 16
  max_window_tokens: 512
  window_overlap_sentences: 1
  reranker_model: cross-encoder/ms-marco-MiniLM-L6-v2
  reranker_device: cpu
  reranker_max_tokens: 512
  reranker_batch_size: 16
  candidates_per_method: 30
  rrf_k: 60
  rerank_top_n: 20
  keep_top: 10
  pipeline_k: 3
  allowed_k: [1, 3, 5]

evidence:
  # Abstracts longer than this are split into bounded sentence windows for the evidence agent.
  max_sentences_per_call: 40
  max_chars_per_call: 12000

judge:
  # In evidence mode, a document with no selected sentences is judged NEI without a model call.
  skip_when_no_evidence: true
  # Supervisor re-asks once when a decisive verdict cites no valid sentence, then downgrades to NEI.
  max_citation_repairs: 1

runtime:
  max_claim_chars: 2000
  max_claim_tokens: 256
  graph_recursion_limit: 25
  random_seed: 42

# ---- v2 judge (added after final_v1; tuned on data/splits/dev_tune.json only) ------------------
# A separate section, so the v1 configuration fingerprint (model/retrieval/evidence/judge/runtime)
# is unchanged. Used by variants with `prompt_set: v2` (configs/experiments.yaml).
judge_v2:
  templates_dir: v2            # prompts/v2/judge.jinja2
  think_budget_tokens: 512     # qwen3 thinking is budget-forced at this many tokens (judge only)
  consistency_check: true      # supervisor verdict/checklist/reason check (re-ask once, then NEI)

# What ClaimChecker.check() uses when the caller does not choose (UI, `check` without --variant,
# `latency`). Evaluation variants always state their own prompt set, so `--variant full` stays v1.
# Set to the v2 judge without thinking after the dev_tune comparison (artifacts/dev_tuning/iterations.md),
# before the single final_v2 run. v1 remains reproducible with `--variant full`.
product:
  prompt_set: v2
  judge_think: false
